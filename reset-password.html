<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MIXORA — Şifre yenile</title>
  <style>
    body{background:#10101b;color:#fff;font:18px system-ui;max-width:460px;margin:48px auto;padding:20px}
    input,button,a{font:inherit}input,button{box-sizing:border-box;width:100%;padding:16px;border-radius:12px}
    input{margin:10px 0;border:1px solid #aaa;background:#202030;color:#fff}button{margin-top:12px;border:0;background:#c6a5ff;color:#171023;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}a{color:#d6bfff}p{line-height:1.6}
    :focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <h1>MIXORA</h1>
  <h2>Yeni şifre belirle</h2>
  <form id="reset">
    <label for="password">Yeni şifre</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="passwordHelp" required>
    <p id="passwordHelp">10–128 karakter kullan. Şifren değişince tüm cihazlardaki oturumların kapanır.</p>
    <button id="confirm" type="submit">Şifreyi yenile</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <p><a href="/community.html">Giriş yap / yeni şifre yenileme bağlantısı iste</a></p>
  <script>
    let token=new URLSearchParams(location.search).get('token');
    const form=document.getElementById('reset'),button=document.getElementById('confirm'),password=document.getElementById('password'),result=document.getElementById('result');
    history.replaceState(null,'',location.pathname);
    if(!token||token.length>256){button.disabled=true;password.disabled=true;result.textContent='Şifre yenileme bağlantısı eksik veya geçersiz. E-postandaki bağlantıyı aç veya yeni bağlantı iste.';}
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(button.disabled||!form.reportValidity())return;
      button.disabled=true;password.disabled=true;form.setAttribute('aria-busy','true');result.textContent='Şifre yenileniyor…';
      try{
        const response=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});
        const data=await response.json();
        if(response.ok){
          result.textContent='Şifren değiştirildi. Şimdi yeni şifrenle giriş yapabilirsin.';
          token=null;password.value='';
        }else{
          result.textContent=data.error||'İşlem başarısız. Tekrar dene.';
          button.disabled=false;password.disabled=false;
        }
      }catch(error){
        result.textContent='Yanıt alınamadı. Bağlantını kontrol edip tekrar dene. İşlem tamamlanmış olabilir; bağlantı geçersiz denirse yeni şifrenle giriş yap veya yeni bağlantı iste.';
        button.disabled=false;password.disabled=false;
      }finally{form.removeAttribute('aria-busy');}
    });
  </script>
</body>
</html>
